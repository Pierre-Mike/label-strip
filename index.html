<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Imprimez vos bordereaux Vinted sur une imprimante thermique 80 mm, sans rien envoyer sur Internet." />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='2' fill='%230f6b74'/%3E%3Cpath d='M11 8h10M11 12h10M11 16h6M10 21h1v5h-1zM13 21h2v5h-2zM17 21h1v5h-1zM20 21h2v5h-2z' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E" />
    <title>Étiquette thermique</title>
  </head>
  <body>
    <header class="top">
      <div>
        <h1 id="title">Étiquette thermique</h1>
        <p id="tagline" class="muted"></p>
      </div>
      <button id="lang" type="button" class="link"></button>
    </header>
    <main>
      <section id="drop" class="drop" aria-labelledby="drop-title">
        <svg class="drop-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 4h14l10 10v30H14z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M28 4v10h10M26 22v14m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h2 id="drop-title"></h2>
        <p><span id="drop-or"></span> <button id="choose" type="button"></button></p>
        <input id="file" type="file" accept=".pdf,.eml,application/pdf,message/rfc822" multiple hidden />
      </section>
      <p id="privacy" class="privacy"></p>
      <div id="banner" class="banner" role="status" hidden></div>
      <div id="toolbar" class="toolbar"></div>
      <section id="labels" class="labels" aria-live="polite"></section>
      <details id="settings" class="panel"></details>
      <details id="help" class="panel"></details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
